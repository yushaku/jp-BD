# Headless routing: Next.js storefront + WordPress admin/checkout on one domain.
#
# Docker Compose upstreams (default):
#   nextjs     → nextjs:3000
#   wordpress  → wordpress:80
#
# Bare metal: copy sos.local.conf.example → sos.local.conf (127.0.0.1:3000 / :8080).

# Re-resolve Docker service names when containers restart (embedded DNS).
resolver 127.0.0.11 valid=10s ipv6=off;

# cloudflared / Cloudflare terminate TLS; nginx sees HTTP — forward original scheme to WordPress.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream nextjs {
    zone nextjs 64k;
    server nextjs:3000 resolve;
    keepalive 16;
}

upstream wordpress {
    zone wordpress 64k;
    server wordpress:80 resolve;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 64M;

    # --- WordPress / WooCommerce (admin, checkout, APIs, static assets) ---

    location ^~ /wp-admin {
        include /etc/nginx/snippets/proxy-headers-wordpress.conf;
        proxy_pass http://wordpress;
    }

    location = /wp-login.php {
        include /etc/nginx/snippets/proxy-headers-wordpress.conf;
        proxy_pass http://wordpress;
    }

    location ^~ /wp-json {
        include /etc/nginx/snippets/proxy-headers-wordpress.conf;
        proxy_pass http://wordpress;
    }

    location ^~ /wp-content {
        include /etc/nginx/snippets/proxy-headers-wordpress.conf;
        proxy_pass http://wordpress;
    }

    location ^~ /wp-includes {
        include /etc/nginx/snippets/proxy-headers-wordpress.conf;
        proxy_pass http://wordpress;
    }

    location ^~ /checkout {
        include /etc/nginx/snippets/proxy-headers-wordpress.conf;
        proxy_pass http://wordpress;
    }

    location ^~ /my-account {
        include /etc/nginx/snippets/proxy-headers-wordpress.conf;
        proxy_pass http://wordpress;
    }

    location ^~ /wc-api {
        include /etc/nginx/snippets/proxy-headers-wordpress.conf;
        proxy_pass http://wordpress;
    }

    location = /wp-cron.php {
        include /etc/nginx/snippets/proxy-headers-wordpress.conf;
        proxy_pass http://wordpress;
    }

    location = /xmlrpc.php {
        return 403;
    }

    # WooCommerce AJAX (?wc-ajax= on any path) — internal rewrite, no `if` in proxy location
    location / {
        set $wc_ajax 0;
        if ($arg_wc-ajax != "") {
            set $wc_ajax 1;
        }
        if ($wc_ajax = 1) {
            rewrite ^ /__proxy_wc_ajax$is_args$args last;
        }

        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://nextjs;
        proxy_read_timeout 120s;
    }

    location = /__proxy_wc_ajax {
        internal;
        rewrite ^ /$is_args$args break;
        include /etc/nginx/snippets/proxy-headers-wordpress.conf;
        proxy_pass http://wordpress;
        proxy_read_timeout 120s;
    }
}
